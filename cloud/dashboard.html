<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JJ's — لوحة الجوال</title>
<!--
  Phone dashboard for the owner. It reads ONLY the "daily_snapshots" table that the shop laptop
  pushes to Supabase every 2 minutes (Settings → Network & cloud). Nothing here can change data.
  Setup: fill SUPABASE_URL and SUPABASE_ANON_KEY below (Supabase → Project settings → API),
  create the owner's login in Supabase → Authentication → Users, then host this file anywhere
  (Supabase Storage, Netlify, GitHub Pages…) or just open it on the phone.
-->
<script>
  const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#f7f6f4; --surface:#fff; --line:#e4e1dc; --ink:#1c1917; --muted:#6b6560; --faint:#9c958f; --bad:#c0392b; --warn:#b7790a; --good:#2e7d4f; --brand:#d2561a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141312; --surface:#1c1b19; --line:#33302d; --ink:#f2f0ed; --muted:#aba49d; --faint:#7d7670; --bad:#f07465; --warn:#e9b24a; --good:#5cc48a; --brand:#e06a2e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 15px/1.5 "IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
  .wrap { max-width: 560px; margin: 0 auto; display:grid; gap:12px; }
  header { display:flex; align-items:center; gap:10px; }
  header h1 { font-size:20px; margin:0; } header .dot { width:10px; height:10px; border-radius:50%; background:var(--brand); }
  header button { margin-inline-start:auto; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .label { color:var(--muted); font-size:13px; }
  .big { font-size:24px; font-weight:700; direction:ltr; text-align:start; font-variant-numeric: tabular-nums; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .num { direction:ltr; unicode-bidi:isolate; font-variant-numeric: tabular-nums; }
  .bad { color:var(--bad); } .warn { color:var(--warn); } .muted { color:var(--muted); }
  input, button, select { font:inherit; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); }
  button { padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; }
  button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .bars { display:grid; gap:6px; }
  .bar { display:grid; grid-template-columns: 70px 1fr 70px; gap:8px; align-items:center; font-size:13px; }
  .bar i { display:block; height:8px; border-radius:4px; background:var(--ink); }
  h2 { font-size:15px; margin:0 0 6px; }
  .err { color:var(--bad); min-height:1.5em; }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="dot"></span><h1 id="title">JJ's</h1><button id="lang">EN</button><button id="out" hidden></button></header>
  <section id="login" class="card" hidden>
    <h2 data-t="signin"></h2>
    <div style="display:grid;gap:8px">
      <input id="email" type="email" autocomplete="username" dir="ltr" />
      <input id="pass" type="password" autocomplete="current-password" dir="ltr" />
      <button class="primary" id="go"></button>
      <div class="err" id="lerr"></div>
    </div>
  </section>
  <section id="main" hidden></section>
</div>
<script>
const T = {
  ar: { signin:"تسجيل الدخول", email:"البريد", pass:"كلمة السر", go:"دخول", out:"خروج", sales:"مبيعات اليوم", orders:"طلبات", items:"قطع", profit:"الربح الإجمالي", net:"الصافي", week:"آخر 7 أيام", boxes:"الصناديق", unpaid:"ديون الزبائن", alerts:"تنبيهات", expired:"منتهي الصلاحية", today:"ينتهي اليوم", low:"مخزون قليل", credit:"قريب من حد الدين", rep:"كاش مع المندوب", none:"لا شيء", updated:"آخر تحديث", noData:"ما في بيانات بعد. شغّل المزامنة من اللابتوب (الإعدادات ← الشبكة والسحابة).", setup:"عبّي SUPABASE_URL و SUPABASE_ANON_KEY بأعلى الملف.", top:"الأكثر مبيعاً", day:"اليوم", lang:"EN" },
  en: { signin:"Sign in", email:"Email", pass:"Password", go:"Sign in", out:"Sign out", sales:"Sales today", orders:"Orders", items:"Items", profit:"Gross profit", net:"Net", week:"Last 7 days", boxes:"Cash boxes", unpaid:"Clients who owe", alerts:"Alerts", expired:"Expired", today:"Expires today", low:"Low stock", credit:"Near credit limit", rep:"Cash with delivery", none:"Nothing", updated:"Updated", noData:"No data yet. Turn on sync on the laptop (Settings → Network & cloud).", setup:"Fill SUPABASE_URL and SUPABASE_ANON_KEY at the top of this file.", top:"Best sellers", day:"Day", lang:"عربي" },
};
let lang = (() => { try { return localStorage.getItem("jjs.dash.lang") || "ar"; } catch { return "ar"; } })();
const t = (k) => T[lang][k];
const usd = (v) => "$" + (Number(v) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pick = (o) => (lang === "ar" ? o.nameAr || o.nameEn : o.nameEn || o.nameAr) || "";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const $ = (id) => document.getElementById(id);
let snap = null;
let client = null;

function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("lang").textContent = t("lang"); $("out").textContent = t("out");
  document.querySelectorAll("[data-t]").forEach((e) => (e.textContent = t(e.dataset.t)));
  $("email").placeholder = t("email"); $("pass").placeholder = t("pass"); $("go").textContent = t("go");
  if (snap) render(snap);
}
$("lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("jjs.dash.lang", lang); } catch {} applyLang(); };

function render(row) {
  const d = row.data, s = d.today || {};
  const max = Math.max(1, ...(d.week || []).map((w) => w.salesUsd));
  const a = d.alerts || {};
  const alertRows = [
    [t("expired"), a.expired?.length || 0, "bad"], [t("today"), a.expiresToday?.length || 0, "warn"], [t("low"), a.lowStock?.length || 0, "warn"],
    [t("credit"), a.nearCreditLimit?.length || 0, "warn"], [t("rep"), a.repCash?.length || 0, "warn"],
  ].filter((x) => x[1] > 0);
  $("main").innerHTML = `
    <div class="grid2">
      <div class="card"><div class="label">${t("sales")}</div><div class="big">${usd(s.salesUsd)}</div></div>
      <div class="card"><div class="label">${t("orders")} · ${t("items")}</div><div class="big">${s.orders || 0} · ${s.items || 0}</div></div>
      ${s.grossProfitUsd !== undefined ? `<div class="card"><div class="label">${t("profit")}</div><div class="big">${usd(s.grossProfitUsd)}</div></div>` : ""}
      ${s.netUsd !== undefined ? `<div class="card"><div class="label">${t("net")}</div><div class="big ${s.netUsd < 0 ? "bad" : ""}">${usd(s.netUsd)}</div></div>` : ""}
    </div>
    <div class="card"><h2>${t("alerts")}</h2>${alertRows.length ? alertRows.map((x) => `<div class="row"><span>${x[0]}</span><b class="num ${x[2]}">${x[1]}</b></div>`).join("") : `<div class="muted">${t("none")}</div>`}</div>
    <div class="card"><h2>${t("week")}</h2><div class="bars">${(d.week || []).map((w) => `<div class="bar"><span class="num muted">${esc(w.date.slice(5))}</span><i style="width:${Math.round((w.salesUsd / max) * 100)}%"></i><span class="num">${usd(w.salesUsd)}</span></div>`).join("")}</div></div>
    <div class="card"><h2>${t("top")}</h2>${(s.byProduct || []).slice(0, 6).map((p) => `<div class="row"><span>${esc(pick(p))}</span><span class="num">${p.qty} · ${usd(p.revenueUsd)}</span></div>`).join("") || `<div class="muted">${t("none")}</div>`}</div>
    <div class="card"><h2>${t("boxes")}</h2>${(d.boxes || []).map((b) => `<div class="row"><span>${esc(pick(b))}</span><span class="num">${b.currency === "SYP" ? Math.round(b.balance).toLocaleString("en-US") + " SYP" : usd(b.balance)}</span></div>`).join("")}</div>
    <div class="card"><h2>${t("unpaid")}</h2>${(d.unpaid || []).map((c) => `<div class="row"><span>${esc(c.name)}</span><span class="num bad">${usd(-c.balanceUsd)}</span></div>`).join("") || `<div class="muted">${t("none")}</div>`}</div>
    <p class="muted" style="text-align:center">${t("updated")}: <span class="num">${esc(new Date(row.updated_at).toLocaleString(lang === "ar" ? "ar-SY-u-nu-latn" : "en-GB"))}</span></p>`;
}

async function load() {
  const { data, error } = await client.from("daily_snapshots").select("*").order("date", { ascending: false }).limit(1);
  if (error) { $("main").innerHTML = `<div class="card bad">${esc(error.message)}</div>`; return; }
  if (!data.length) { $("main").innerHTML = `<div class="card">${t("noData")}</div>`; return; }
  snap = data[0]; render(snap);
}

async function show() {
  const { data } = await client.auth.getSession();
  const inside = !!data.session;
  $("login").hidden = inside; $("main").hidden = !inside; $("out").hidden = !inside;
  if (inside) { await load(); }
}

applyLang();
if (SUPABASE_URL.includes("YOUR-PROJECT")) {
  $("main").hidden = false; $("main").innerHTML = `<div class="card">${t("setup")}</div>`;
} else {
  client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  $("go").onclick = async () => {
    $("lerr").textContent = "";
    const { error } = await client.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
    if (error) $("lerr").textContent = error.message; else show();
  };
  $("out").onclick = async () => { await client.auth.signOut(); snap = null; show(); };
  show();
  setInterval(() => { if (!$("main").hidden && client) load(); }, 60_000);
}
</script>
</body>
</html>
